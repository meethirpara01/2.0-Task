<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Document</title>
</head>
<body>
    <main>
        <div class="reelcontainer">
            <div class="reels">
                <video autoplay muted loop src="./Assets/video1.mp4"></video>
                <div class="userdetails">
                    <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=761&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="" srcset="">
                    <h4 class="username">jake.nackos</h4>
                    <button class="btn">Follow</button>
                </div>
                <div class="caption">
                    <h4>#insta #instagram Behind every successful person is a substantial amount of coffee.</h4>
                </div>
                <div class="interectoptions">
                    <div class="like">
                        <h4><i class="likeunfilled ri-heart-line"></i></h4>
                        <h4>200</h4>
                    </div>
                    <div class="comment">
                        <h4><i class="ri-chat-3-line"></i></h4>
                        <h4>99</h4>
                    </div>
                    <div class="share">
                        <h4><i class="ri-share-forward-line"></i></h4>
                        <h4>500</h4>
                    </div>
                    <div class="menu">
                        <h4><i class="ri-more-2-fill"></i></h4>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
