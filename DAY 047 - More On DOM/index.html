<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <main>
        <div class="pionoKeyboard">
            <div class="pionoOneOctave">
                <div id="white-key" class="C4">
                    <div></div>
                    <span class="keyboardnote">A</span>
                    <span class="notename">C</span>
                </div>
                <div id="white-key" class="D4">
                    <div></div>
                    <span class="keyboardnote">S</span>
                    <span class="notename">D</span>
                </div>
                <div id="white-key" class="E4">
                    <div></div>
                    <span class="keyboardnote">D</span>
                    <span class="notename">E</span>
                </div>
                <div id="white-key" class="F4">
                    <div></div>
                    <span class="keyboardnote">F</span>
                    <span class="notename">F</span>
                </div>
                <div id="white-key" class="G4">
                    <div></div>
                    <span class="keyboardnote">G</span>
                    <span class="notename">G</span>
                </div>
                <div id="white-key" class="A4">
                    <div></div>
                    <span class="keyboardnote">H</span>
                    <span class="notename">A</span>
                </div>
                <div id="white-key" class="B4">
                    <div></div>
                    <span class="keyboardnote">J</span>
                    <span class="notename">B</span>
                </div>

                <!-- BLACK KEY -->
                <div id="black-key" class="C4b">
                    <span>W</span>
                </div>
                <div id="black-key" class="D4b">
                    <span>E</span>
                </div>
                <div id="black-key" class="F4b">
                    <span>T</span>
                </div>
                <div id="black-key" class="G4b">
                    <span>Y</span>
                </div>
                <div id="black-key" class="A4b">
                    <span>U</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
